fragment ExternalProduct on ExternalProduct {
  externalUrl
  buttonText
  ...ProductPricing
  image {
    ...Image
    cartSourceUrl: sourceUrl(size: THUMBNAIL)
    productCardSourceUrl: sourceUrl(size: WOOCOMMERCE_THUMBNAIL)
  }
  galleryImages(first: 20) {
    nodes {
      ...Image
      databaseId
    }
  }
}
